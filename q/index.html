<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>عرض سعر</title>
<style>
:root{--bg:#F3F5F4;--card:#fff;--ink:#14211D;--muted:#66736F;--line:#E2E7E5;--acc:#0E6B57;--acc2:#F2B544;--ok:#1E7B4F;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0E1513;--card:#16201D;--ink:#E8EFEC;--muted:#9AA8A3;--line:#26332F}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;padding:0 0 120px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.head{background:linear-gradient(135deg,#0F2E2A,#0E6B57);color:#fff;border-radius:0 0 22px 22px;padding:22px 18px 26px;margin:-16px -16px 16px}
.head small{opacity:.8}.head h1{margin:2px 0 6px;font-size:22px}.head .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.item{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0;padding-top:0}
.item.noimg{grid-template-columns:1fr}
.ph{width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--line);cursor:zoom-in}
.nm{font-weight:700}.ds{color:var(--muted);font-size:14px}.pr{display:flex;justify-content:space-between;margin-top:4px;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;padding:4px 0}.tot.big{font-size:22px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.note{background:color-mix(in srgb,var(--acc2) 18%,transparent);border-radius:12px;padding:10px 12px;font-size:14.5px}
.state{text-align:center;font-weight:700;border-radius:12px;padding:10px;margin-bottom:12px}.state.exp{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.btns{display:grid;grid-template-columns:1fr auto;gap:8px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;cursor:pointer}
.yes{background:#25D366;color:#06210f;font-size:17px}.no{background:transparent;color:var(--muted);border:1px solid var(--line)}
.err{text-align:center;padding:60px 20px;color:var(--muted)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}.zoom img{max-width:94vw;max-height:90vh;border-radius:10px}.zoom.on{display:flex}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">جاري فتح العرض…</div></div>
<div class="zoom" id="zoom" onclick="this.classList.remove('on')"><img alt=""></div>
<script>
(async () => {
  const $ = s => document.querySelector(s), esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const app = $('#app'), h = location.hash.slice(1);
  const fromB64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  let d;
  try {
    if (h[0] === 'z') { const s = new Blob([fromB64u(h.slice(1))]).stream().pipeThrough(new DecompressionStream('deflate-raw')); d = JSON.parse(await new Response(s).text()); }
    else if (h[0] === 'j') d = JSON.parse(new TextDecoder().decode(fromB64u(h.slice(1))));
  } catch (e) { d = null; }
  if (!d || !d.q) { app.innerHTML = '<div class="err">الرابط ناقص أو تالف — اطلب من المحل يرسله مرة ثانية.</div>'; return; }
  const en = d.s.l === 'en'; if (en) { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  const L = en ? { q: 'Quotation', no: 'No.', date: 'Date', valid: 'Valid until', for: 'For', qty: 'Qty', sub: 'Subtotal', vat: 'VAT', tot: 'Total', incl: 'incl. VAT', ok: '✅ I approve the quote', no2: 'Decline', note: 'Notes for the shop (optional)', exp: 'This quote has expired — ask the shop for a new one.', thanks: 'WhatsApp will open with your message — press send.', approveMsg: 'I approve quote', declineMsg: 'I decline quote', noteW: 'Note' }
    : { q: 'عرض سعر', no: 'رقم', date: 'التاريخ', valid: 'صالح حتى', for: 'إلى', qty: 'الكمية', sub: 'المجموع قبل الضريبة', vat: 'الضريبة', tot: 'الإجمالي', incl: 'شامل الضريبة', ok: '✅ أعتمد العرض', no2: 'ما أبيه', note: 'ملاحظة للمحل (اختياري)', exp: 'انتهت مدة هذا العرض — اطلب من المحل عرض جديد.', thanks: 'بينفتح الواتساب والرسالة جاهزة — اضغط إرسال.', approveMsg: 'أعتمد عرض السعر رقم', declineMsg: 'ما أبي عرض السعر رقم', noteW: 'ملاحظة' };
  const money = v => (Math.round(v * 100) / 100).toLocaleString(en ? 'en' : 'ar-SA-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.title = `${L.q} ${d.q.no} — ${d.s.n || ''}`;
  const items = d.i || [], total = items.reduce((a, x) => a + (+x[1] || 0) * (+x[2] || 0), 0), vr = +d.s.vr || 0;
  const net = vr ? (d.s.inc ? total / (1 + vr / 100) : total) : total, vat = vr ? (d.s.inc ? total - net : total * vr / 100) : 0, grand = d.s.inc || !vr ? total : total + vat;
  const expired = d.q.u && new Date(d.q.u + 'T23:59:59') < new Date();
  app.innerHTML = `<div class="head"><small>${L.q}</small><h1>${esc(d.s.n || '')}</h1><div class="meta"><span>${L.no}: <b class="num">${esc(d.q.no)}</b></span><span>${L.date}: <span class="num">${esc(d.q.d)}</span></span>${d.q.u ? `<span>${L.valid}: <span class="num">${esc(d.q.u)}</span></span>` : ''}${d.q.n ? `<span>${L.for}: <b>${esc(d.q.n)}</b></span>` : ''}</div></div>
   ${expired ? `<div class="state exp">${L.exp}</div>` : ''}
   <div class="card">${items.map(x => `<div class="item${x[3] ? '' : ' noimg'}">${x[3] ? `<img class="ph" src="${esc(x[3])}" alt="" loading="lazy">` : ''}<div><div class="nm">${esc(x[0])}</div>${x[4] ? `<div class="ds">${esc(x[4])}</div>` : ''}
     <div class="pr"><span class="ds">${L.qty}: <span class="num">${esc(x[1])}</span> × <span class="num">${money(+x[2] || 0)}</span></span><b class="num">${money((+x[1] || 0) * (+x[2] || 0))} ${esc(d.s.c || '')}</b></div></div></div>`).join('')}</div>
   <div class="card">${vr ? `<div class="tot"><span>${L.sub}</span><span class="num">${money(net)}</span></div><div class="tot"><span>${L.vat} ${vr}%</span><span class="num">${money(vat)}</span></div>` : ''}
    <div class="tot big"><span>${L.tot}</span><span class="num">${money(grand)} ${esc(d.s.c || '')}</span></div>${vr && d.s.inc ? `<div class="ds" style="text-align:end">${L.incl}</div>` : ''}</div>
   ${d.q.nt ? `<div class="note">${esc(d.q.nt)}</div>` : ''}
   <div class="foot">${esc(d.s.a || '')}</div>`;
  app.querySelectorAll('.ph').forEach(im => im.addEventListener('click', () => { $('#zoom img').src = im.src; $('#zoom').classList.add('on'); }));
  if (expired || !d.s.p) return;
  const bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = `<div class="in"><textarea id="note" rows="1" placeholder="${L.note}"></textarea><div class="btns"><button class="yes" id="yes">${L.ok}</button><button class="no" id="no">${L.no2}</button></div><div class="ds" id="msg" hidden style="text-align:center">${L.thanks}</div></div>`;
  document.body.appendChild(bar);
  const go = ok => { const n = $('#note').value.trim(); const text = `${ok ? '✅ ' + L.approveMsg : '✖ ' + L.declineMsg} ${d.q.no}${n ? `\n${L.noteW}: ${n}` : ''}`;
    $('#msg').hidden = false; location.href = `https://wa.me/${encodeURIComponent(d.s.p)}?text=${encodeURIComponent(text)}`; };
  $('#yes').onclick = () => go(true); $('#no').onclick = () => go(false);
})();
</script>
</body>
</html>
